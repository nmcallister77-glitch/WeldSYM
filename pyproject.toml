[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weldsim"
version = "0.1.0"
description = "Open-source welding residual stress and distortion simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "nmcallister77-glitch", email = "your-email@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The solvers and the weld report need nothing but NumPy and a YAML reader, so a
# plain install runs the whole assessment offline. Everything heavier belongs to
# the optional OpenFOAM/CAD routes.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cad = ["pythonocc-core>=7.7"]
gui = ["streamlit>=1.30", "matplotlib>=3.8"]
cfd = ["pyvista>=0.42", "gmsh>=4.13"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pre-commit>=3.6",
    "mkdocs>=1.5",
    "black>=23.12",
    "flake8>=7.0",
    "mypy>=1.8",
]

[project.urls]
Repository = "https://github.com/nmcallister77-glitch/WeldSYM"
Issues = "https://github.com/nmcallister77-glitch/WeldSYM/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true

[project.scripts]
weldsim = "weldsim.cli:main"
