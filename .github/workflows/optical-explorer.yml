name: Optical explorer

on:
  pull_request:
    paths:
      - "optical-explorer/**"
      - ".github/workflows/optical-explorer.yml"
  push:
    branches: [main]
    paths:
      - "optical-explorer/**"
      - ".github/workflows/optical-explorer.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optical-explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: optical-explorer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ldd-optical-explorer
          path: optical-explorer/dist/index.html
